name: Sign and release

# Builds the Pointy plugin package from an upstream pointylab/pointy tag,
# signs and notarizes Pointy.app with this repo's Developer ID, and publishes
# it as a GitHub release here, with a build-provenance attestation. Upstream
# picks the release up, verifies the attestation and publishes it to npm.
#
# Runs every 15 minutes and picks up the newest upstream release this repo has not
# published yet; or run it by hand with a tag. Signing runs in the `release`
# environment, so a required reviewer there approves every signature.
#
# Secrets (in the `release` environment):
#   APPLE_CERTIFICATE           base64 of a Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple ID that notarizes
#   APPLE_PASSWORD              its app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID               team of the certificate

on:
  schedule:
    # Off the hour, when GitHub's scheduler is least busy.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to sign, e.g. v0.5.0 (empty = newest upstream release)
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: pointylab/pointy

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      # GitHub turns off schedules in a public repo after 60 days without
      # activity, and this repo rarely gets commits; enabling the workflow
      # again resets that clock.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable"
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "not a version tag: $tag"; exit 1
          fi
          if [ -z "$INPUT_TAG" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published here"; exit 0
          fi
          # Pin the commit now, so a tag moved later cannot change what gets signed.
          sha=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)
          echo "signing $UPSTREAM $tag at $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache: false
      - run: npm ci
      - run: npm run check

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "the release environment has no signing certificate"; exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Store the notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "the release environment has no notarization credentials"; exit 1
          fi
          xcrun notarytool store-credentials pointy-notary --keychain "$NOTARY_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
          echo "APPLE_NOTARY_PROFILE=pointy-notary" >> "$GITHUB_ENV"

      - name: Pack the plugin
        run: node tools/pack-plugin.ts

      - name: Check the signature, notarization and version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          app=plugin/pet/Pointy.app
          codesign -dv --verbose=2 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -qF "Authority=$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/codesign.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
          version=$(node -p "require('./plugin/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match plugin/package.json $version"; exit 1
          fi

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tgz
      - uses: actions/upload-artifact@v5
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: pkg
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" pkg/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" pkg/*.tgz --repo "$GITHUB_REPOSITORY" --title "$TAG" --target main \
              --notes "Signed and notarized build of [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG), from commit $SHA."
          fi
